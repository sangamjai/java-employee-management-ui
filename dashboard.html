<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeamDesk — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="sidebar__brand-mark">TD</div>
      <div class="sidebar__brand-name">TeamDesk</div>
    </div>
    <nav class="sidebar__nav">
      <a class="nav-item is-active" href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Dashboard
      </a>
      <a class="nav-item" href="employees.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Employees
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
        Attendance
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>

      </a>
      <a class="nav-item" href="#">

        Settings
      </a>
    </nav>
    <div class="sidebar__footer">
      <a class="sidebar__user" href="index.html">
        <div class="avatar">RS</div>
        <div>
          <div class="sidebar__user-name">Ravi Sinha</div>
          <div class="sidebar__user-role">Admin · Sign out</div>
        </div>
      </a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;">
        <button class="topbar__menu-btn" aria-label="Toggle menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18"/><path d="M3 6h18"/><path d="M3 18h18"/></svg>
        </button>
        <h2 class="topbar__title">Dashboard</h2>
      </div>
      <div class="topbar__right">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" placeholder="Search…">
        </div>
        <div class="avatar">RS</div>
      </div>
    </header>

    <main class="content">
      <div class="stat-grid" id="statGrid"></div>

      <div class="two-col">
        <div class="card panel">
          <div class="panel__head">
            <h3>Team by department</h3>
          </div>
          <div id="deptBreakdown"></div>
        </div>

        <div class="card panel">
          <div class="panel__head">
            <h3>Recent activity</h3>
          </div>
          <div id="activityList"></div>
        </div>
      </div>
    </main>
  </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
