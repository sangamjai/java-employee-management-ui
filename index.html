<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeamDesk — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-screen">
  <div class="auth-side">
    <div class="sidebar__brand" style="padding:0;">
      <div class="sidebar__brand-mark">TD</div>
      <div class="sidebar__brand-name">TeamDesk</div>
    </div>
    <div class="auth-side__quote">
      <p>“Onboarding used to take our HR team three days. It's down to twenty minutes.”</p>
      <span>Priya Nair, HR Generalist</span>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-form">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to manage your team.</p>

      <div class="auth-error" id="loginError"></div>

      <form id="loginForm" novalidate>
        <div class="form-field">
          <label for="email">Work email</label>
          <input type="email" id="email" name="email" placeholder="you@company.com" required>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <div class="auth-form__row">
          <label style="display:flex;align-items:center;gap:6px;color:var(--ink-soft);">
            <input type="checkbox" style="width:auto;"> Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn--primary">Sign in</button>
      </form>

      <p class="auth-hint">Demo build — any email + a password of 4+ characters signs you in.</p>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
